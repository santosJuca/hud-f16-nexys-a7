name: Simulacao RTL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulacao:
    name: Regressao RTL e video
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar simuladores
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog verilator make g++ python3 python3-pil ffmpeg

      - name: Registrar versoes
        run: |
          iverilog -V
          vvp -V
          verilator --version
          g++ --version
          python3 --version
          ffmpeg -version

      - name: Executar simulacoes
        run: |
          mkdir -p build
          scripts/test.sh 2>&1 | tee build/tests.log

      - name: Testar ferramentas Python
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Testar video, captura e partida automatica
        run: scripts/test_attitude_capture.sh build/capture 2>&1 | tee build/capture.log

      - name: Salvar log e capturas VGA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacao-rtl
          path: |
            build/tests.log
            build/capture.log
            build/capture/**/*.log
            build/*.ppm
            build/tests/*.ppm
          if-no-files-found: warn
          retention-days: 14
