<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">Referência de cores do cabo VGA</title>
<desc id="desc">Vista frontal do conector VGA DE-15 e tabela de cores dos fios informadas pelo usuário, com retornos e blindagens comuns.</desc>
<defs>
  <style>
    .bg{fill:#f4f7fb}.card{fill:#fff;stroke:#d8e0ea;stroke-width:2}.title{font:700 34px Arial,sans-serif;fill:#172b4d}.subtitle{font:18px Arial,sans-serif;fill:#53657d}.section{font:700 22px Arial,sans-serif;fill:#233957}.body{font:18px Arial,sans-serif;fill:#26384d}.small{font:15px Arial,sans-serif;fill:#53657d}.pin{fill:#26384d;stroke:#fff;stroke-width:2}.pintext{font:700 15px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.pintextDark{font:700 15px Arial,sans-serif;fill:#26384d;text-anchor:middle;dominant-baseline:central}.tblhead{font:700 16px Arial,sans-serif;fill:#53657d}.tbl{font:17px Arial,sans-serif;fill:#25384f}.bold{font-weight:700}.line{stroke:#e3e9f0;stroke-width:1.5}.wire-pink{stroke:#e58ba7}.wire-white{stroke:#bfc8d4}.wire-blue{stroke:#3783d1}.wire-green{stroke:#38a878}.wire-red{stroke:#d44f55}.wire{fill:none;stroke-width:9;stroke-linecap:round}.shield{fill:none;stroke:#687b91;stroke-width:2;stroke-dasharray:5 4}.badge{fill:#fff5db;stroke:#edcf84;stroke-width:1.5}.badgeText{font:700 15px Arial,sans-serif;fill:#765819}
  </style>
</defs>
<rect class="bg" width="1500" height="1000"/>
<text x="60" y="72" class="title">Cabo VGA · referência de cores</text>
<text x="60" y="108" class="subtitle">Mapeamento informado e conferido na bancada · use a numeração dos pinos, não apenas a cor</text>
<rect class="card" x="50" y="140" width="620" height="790" rx="18"/>
<rect class="card" x="700" y="140" width="750" height="790" rx="18"/>
<text x="85" y="188" class="section">Conector DE-15, vista frontal</text>
<text x="85" y="216" class="small">Olhe de frente para os contatos do conector</text>
<!-- connector shell -->
<path d="M145 260 Q145 245 165 245 H555 Q575 245 575 260 L545 485 Q542 505 520 505 H200 Q178 505 175 485 Z" fill="#e7edf4" stroke="#8292a6" stroke-width="3"/>
<rect x="210" y="274" width="300" height="174" rx="18" fill="#34475e"/>
<!-- 15 pin layout, front view: rows 1-5, 6-10, 11-15 -->
<g>
<circle class="pin" cx="240" cy="305" r="14"/><text class="pintext" x="240" y="305">1</text><circle class="pin" cx="300" cy="305" r="14"/><text class="pintext" x="300" y="305">2</text><circle class="pin" cx="360" cy="305" r="14"/><text class="pintext" x="360" y="305">3</text><circle class="pin" cx="420" cy="305" r="14"/><text class="pintext" x="420" y="305">4</text><circle class="pin" cx="480" cy="305" r="14"/><text class="pintext" x="480" y="305">5</text>
<circle class="pin" cx="240" cy="361" r="14"/><text class="pintext" x="240" y="361">6</text><circle class="pin" cx="300" cy="361" r="14"/><text class="pintext" x="300" y="361">7</text><circle class="pin" cx="360" cy="361" r="14"/><text class="pintext" x="360" y="361">8</text><circle class="pin" cx="420" cy="361" r="14"/><text class="pintext" x="420" y="361">9</text><circle class="pin" cx="480" cy="361" r="14"/><text class="pintext" x="480" y="361">10</text>
<circle class="pin" cx="240" cy="417" r="14"/><text class="pintext" x="240" y="417">11</text><circle class="pin" cx="300" cy="417" r="14"/><text class="pintext" x="300" y="417">12</text><circle class="pin" cx="360" cy="417" r="14"/><text class="pintext" x="360" y="417">13</text><circle class="pin" cx="420" cy="417" r="14"/><text class="pintext" x="420" y="417">14</text><circle class="pin" cx="480" cy="417" r="14"/><text class="pintext" x="480" y="417">15</text>
</g>
<text x="85" y="555" class="section">Pinos usados nesta bancada</text>
<g class="body">
<text x="100" y="596"><tspan class="bold">1</tspan><tspan> · R — rosa, blindado</tspan></text>
<text x="100" y="632"><tspan class="bold">2</tspan><tspan> · G — branco, blindado</tspan></text>
<text x="100" y="668"><tspan class="bold">3</tspan><tspan> · B — azul, blindado</tspan></text>
<text x="100" y="704"><tspan class="bold">6, 7, 8</tspan><tspan> · retornos R/G/B</tspan></text>
<text x="100" y="740"><tspan class="bold">10</tspan><tspan> · GND sincronismo — vermelho</tspan></text>
<text x="100" y="776"><tspan class="bold">13</tspan><tspan> · HSYNC — verde, blindado</tspan></text>
<text x="100" y="812"><tspan class="bold">14</tspan><tspan> · VSYNC — azul, separado</tspan></text>
</g>
<rect class="badge" x="85" y="850" width="545" height="48" rx="10"/><text class="badgeText" x="105" y="880">Azul aparece nos pinos 3 e 14: confira o pino.</text>
<!-- right panel cable schematic -->
<text x="735" y="188" class="section">Cores dos condutores</text>
<text x="735" y="216" class="small">Blindado = condutor central envolvido por malha metálica</text>
<!-- RGB rows -->
<g>
<circle cx="765" cy="278" r="21" fill="#f4b5c6" stroke="#c9758f" stroke-width="2"/><text x="765" y="284" class="pintext" fill="#26384d">1</text><path class="wire wire-pink" d="M800 278 H865"/><rect x="798" y="264" width="70" height="28" rx="14" class="shield"/><text x="890" y="274" class="tbl bold">R / vermelho</text><text x="890" y="298" class="tbl">rosa · blindado</text>
<circle cx="765" cy="352" r="21" fill="#fff" stroke="#bfc8d4" stroke-width="2"/><text x="765" y="358" class="pintextDark">2</text><path class="wire wire-white" d="M800 352 H865"/><rect x="798" y="338" width="70" height="28" rx="14" class="shield"/><text x="890" y="348" class="tbl bold">G / verde</text><text x="890" y="372" class="tbl">branco · blindado</text>
<circle cx="765" cy="426" r="21" fill="#3783d1"/><text x="765" y="432" class="pintext">3</text><path class="wire wire-blue" d="M800 426 H865"/><rect x="798" y="412" width="70" height="28" rx="14" class="shield"/><text x="890" y="422" class="tbl bold">B / azul</text><text x="890" y="446" class="tbl">azul · blindado</text>
</g>
<line class="line" x1="735" y1="485" x2="1415" y2="485"/>
<text x="735" y="525" class="section">Sincronismo e retornos</text>
<circle cx="765" cy="578" r="21" fill="#d44f55"/><text x="765" y="584" class="pintext">10</text><path class="wire wire-red" d="M800 578 H865"/><text x="890" y="574" class="tbl bold">GND de sincronismo · vermelho</text><text x="890" y="598" class="small">Ligado 10↔10 entre os cabos</text>
<circle cx="765" cy="646" r="21" fill="#38a878"/><text x="765" y="652" class="pintext">13</text><path class="wire wire-green" d="M800 646 H865"/><rect x="798" y="632" width="70" height="28" rx="14" class="shield"/><text x="890" y="642" class="tbl bold">HSYNC · verde, blindado</text><text x="890" y="666" class="small">Condutor central verde</text>
<circle cx="765" cy="714" r="21" fill="#3783d1"/><text x="765" y="720" class="pintext">14</text><path class="wire wire-blue" d="M800 714 H865"/><text x="890" y="710" class="tbl bold">VSYNC · azul</text><text x="890" y="734" class="small">Fio separado, sem blindagem identificada</text>
<!-- common block -->
<rect x="735" y="770" width="680" height="130" rx="14" fill="#eef3f8" stroke="#cbd6e2" stroke-width="1.5"/>
<text x="760" y="805" class="tbl bold">Fio extra / retorno comum</text>
<text x="760" y="833" class="small">Em cada cabo: continuidade com pinos 6, 7, 8 e 10,</text>
<text x="760" y="857" class="small">e com as blindagens de R, G e B, segundo o teste informado.</text>
<text x="760" y="883" class="small">Não há cores individuais registradas para os retornos.</text>
<text x="60" y="970" class="small">Referência visual da montagem relatada. Identifique os fios pela continuidade e pela numeração dos pinos.</text>
</svg>
